<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Hire Me</title>
    <meta name="description" content="Get in touch for System Administration or Server Management inquiries.">
    <link rel="stylesheet" href="styles/main.css">
    <script src="js/components.js" defer></script>
    <style>
        .contact-form {
            background: var(--light-gray);
            padding: 3rem;
            border-radius: 12px;
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
        }
    </style>
</head>
<body>

    <header></header>

    <main>
        <section>
            <div class="container">
                <div style="text-align: center; margin-bottom: 4rem;">
                    <h2>Get In Touch</h2>
                    <p>Have a project in mind or need help with your servers? Send a message.</p>
                </div>

                <div class="contact-form">
                    <form action="#" method="POST">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" placeholder="Your Name" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" placeholder="your@email.com" required>
                        </div>
                        <div class="form-group">
                            <label>Message</label>
                            <textarea rows="5" placeholder="How can I help you?"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer></footer>

</body>
</html>
